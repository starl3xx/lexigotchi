# Lexigotchi smart contracts — Foundry config.
# OpenZeppelin is resolved from the repo's node_modules (installed via npm, see package.json);
# forge-std is vendored under lib/. Run `npm install` at the repo root before `forge build`.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/",
]
gas_reports = ["*"]
fs_permissions = [{ access = "read", path = "./config" }]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
