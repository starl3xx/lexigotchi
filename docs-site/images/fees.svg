/text></g><rect x="112" y="196" width="488" height="34" rx="8" fill="none" stroke="#1b1714" stroke-width="3"/><text x="34" y="271" font-size="16" font-weight="800">Snack</text><clipPath id="fee-row-3"><rect x="112" y="248" width="488" height="34" rx="8"/></clipPath><g clip-path="url(#fee-row-3)"><rect x="112" y="248" width="488" height="34" fill="#bd3d35"/><text x="356" y="270" text-anchor="middle" font-size="14" font-weight="800" style="fill:#fbf4e3">100%</text></g><rect x="112" y="248" width="488" height="34" rx="8" fill="none" stroke="#1b1714" stroke-width="3"/></svg>