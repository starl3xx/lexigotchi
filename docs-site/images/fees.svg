<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" width="640" height="366" role="img"><title>Where each fee goes: burned, Rewards Pool, jackpot, and treasury</title><style>
@keyframes tcBreathe{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--uy) * -3))}}.animate-tc-breathe{animation:tcBreathe 3.6s ease-in-out infinite}
@keyframes tcLegBreathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.06)}}.animate-tc-legbreathe{animation:tcLegBreathe 3.6s ease-in-out infinite}
@keyframes tcSigh{0%,100%{transform:translateY(calc(var(--uy) * 1))}45%{transform:translateY(calc(var(--uy) * -1.5))}}.animate-tc-sigh{animation:tcSigh 5.2s ease-in-out infinite}
@keyframes tcLegSigh{0%,100%{transform:scaleY(0.98)}45%{transform:scaleY(1.03)}}.animate-tc-legsigh{animation:tcLegSigh 5.2s ease-in-out infinite}
@keyframes tcSleep{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-0.7deg) translateY(calc(var(--uy) * 0.8))}}.animate-tc-sleep{animation:tcSleep 5.6s ease-in-out infinite}
@keyframes tcHop{0%{transform:translateY(0) rotate(0deg);animation-timing-function:cubic-bezier(0.2, 0.7, 0.4, 1)}14%{transform:translateY(calc(var(--uy) * -12)) rotate(-2deg);animation-timing-function:cubic-bezier(0.6, 0, 0.8, 0.4)}28%{transform:translateY(0) rotate(0deg);animation-timing-function:cubic-bezier(0.2, 0.7, 0.4, 1)}38%{transform:translateY(calc(var(--uy) * -5)) rotate(1.5deg);animation-timing-function:cubic-bezier(0.6, 0, 0.8, 0.4)}48%,100%{transform:translateY(0) rotate(0deg)}}.animate-tc-hop{animation:tcHop 1.7s linear infinite}
@keyframes tcLegHop{0%{transform:scaleY(1);animation-timing-function:cubic-bezier(0.2, 0.7, 0.4, 1)}14%{transform:scaleY(1.23);animation-timing-function:cubic-bezier(0.6, 0, 0.8, 0.4)}28%{transform:scaleY(1);animation-timing-function:cubic-bezier(0.2, 0.7, 0.4, 1)}38%{transform:scaleY(1.096);animation-timing-function:cubic-bezier(0.6, 0, 0.8, 0.4)}48%,100%{transform:scaleY(1)}}.animate-tc-leghop{animation:tcLegHop 1.7s linear infinite}
@keyframes tcJump{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(calc(var(--uy) * -15)) rotate(1.5deg)}}.animate-tc-jump{animation:tcJump 0.75s ease-in-out infinite}
@keyframes tcLegJump{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.29)}}.animate-tc-legjump{animation:tcLegJump 0.75s ease-in-out infinite}
@keyframes tcBrace{0%,100%{transform:translate(calc(var(--ux) * -1.3), 0)}50%{transform:translate(calc(var(--ux) * 1.3), calc(var(--uy) * 0.6))}}.animate-tc-brace{animation:tcBrace 0.17s linear infinite}
@keyframes tcKnock{0%,100%{transform:skewX(-5deg)}50%{transform:skewX(5deg)}}.animate-tc-knock{animation:tcKnock 0.34s ease-in-out infinite}
@keyframes tcSweat{0%{opacity:0;transform:translate(calc(var(--ux) * var(--fx) * -3), calc(var(--uy) * var(--fy) * -3)) scale(0.5)}18%,62%{opacity:1}100%{opacity:0;transform:translate(calc(var(--ux) * var(--fx) * 18), calc(var(--uy) * var(--fy) * 18)) scale(1)}}.animate-tc-sweat{animation:tcSweat 1.5s ease-out infinite}
@keyframes tcPeekOpen{0%{opacity:0}60%{opacity:1}82%,100%{opacity:0}}.animate-tc-peek-open{animation:tcPeekOpen 3.2s step-end infinite}
@keyframes tcPeekShut{0%{opacity:1}60%{opacity:0}82%,100%{opacity:1}}.animate-tc-peek-shut{animation:tcPeekShut 3.2s step-end infinite}
@keyframes tcConfetti{0%{opacity:0;transform:translateY(-133%) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translateY(var(--tc-fall, 1400%)) rotate(360deg)}}.animate-tc-confetti{animation:tcConfetti 1.5s linear infinite}
@keyframes tcRay{to{transform:rotate(360deg)}}.animate-tc-ray{animation:tcRay 18s linear infinite}
@keyframes tcZzz{0%{opacity:0;transform:translateY(calc(var(--uy) * 2)) scale(0.8)}30%{opacity:1}100%{opacity:0;transform:translateY(calc(var(--uy) * -14)) scale(1.1)}}.animate-tc-zzz{animation:tcZzz 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){[class*="animate-tc-"]{animation:none!important}}
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1b1714}
