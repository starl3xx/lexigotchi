<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 314" width="640" height="314" role="img"><title>Where each fee goes: burned, Rewards Pool, jackpot, and treasury</title><style>
@keyframes tcIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.animate-tc-idle{animation:tcIdle 1.5s ease-in-out infinite}
@keyframes tcLegBob{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.11)}}.animate-tc-legbob{animation:tcLegBob 1.5s ease-in-out infinite}
@keyframes tcBobSlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.animate-tc-bobslow{animation:tcBobSlow 2.6s ease-in-out infinite}
@keyframes tcRoll{0%,100%{transform:translate(0,0)}25%{transform:translate(-2.5px,1px)}75%{transform:translate(2.5px,-1px)}}.animate-tc-roll{animation:tcRoll 0.24s ease-in-out infinite}
@keyframes tcEat{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.animate-tc-eat{animation:tcEat 0.5s ease-in-out infinite}
@keyframes tcPop{0%,100%{transform:scale(1)}45%{transform:scale(1.13)}70%{transform:scale(0.97)}}.animate-tc-pop{animation:tcPop 0.9s ease-in-out infinite}
@keyframes tcJump{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-15px) rotate(1.5deg)}}.animate-tc-jump{animation:tcJump 0.75s ease-in-out infinite}
@keyframes tcConfetti{0%{opacity:0;transform:translateY(-16px) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translateY(var(--tc-fall, 82px)) rotate(360deg)}}.animate-tc-confetti{animation:tcConfetti 1.5s linear infinite}
@keyframes tcRay{to{transform:rotate(360deg)}}.animate-tc-ray{animation:tcRay 7s linear infinite}
@keyframes tcTwinkle{0%,100%{transform:scale(0.5) rotate(0deg);opacity:0.35}50%{transform:scale(1.15) rotate(35deg);opacity:1}}.animate-tc-twinkle{animation:tcTwinkle 1.8s ease-in-out infinite}
@keyframes tcDart{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}.animate-tc-dart{animation:tcDart 0.9s ease-in-out infinite}
@keyframes tcZzz{0%{opacity:0;transform:translateY(2px) scale(0.8)}30%{opacity:1}100%{opacity:0;transform:translateY(-14px) scale(1.1)}}.animate-tc-zzz{animation:tcZzz 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){[class*="animate-tc-"]{animation:none!important}}
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1b1714}
