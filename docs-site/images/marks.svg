<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 182" width="680" height="182" role="img"><title>Each rarity’s mark: Common is a round bead, Uncommon has three corners, Rare four, Legendary five, and Mythic six</title><style>
@keyframes tcBreathe{0%,100%{transform:translateY(0) scale(1.004, 0.996)}50%{transform:translateY(calc(var(--uy) * -3)) scale(0.995, 1.008)}}.animate-tc-breathe{animation:tcBreathe 3.6s ease-in-out infinite}
@keyframes tcLegBreathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.06)}}.animate-tc-legbreathe{animation:tcLegBreathe 3.6s ease-in-out infinite}
@keyframes tcSigh{0%,100%{transform:translateY(calc(var(--uy) * 1))}45%{transform:translateY(calc(var(--uy) * -1.5))}}.animate-tc-sigh{animation:tcSigh 5.2s ease-in-out infinite}
@keyframes tcLegSigh{0%,100%{transform:scaleY(0.98)}45%{transform:scaleY(1.03)}}.animate-tc-legsigh{animation:tcLegSigh 5.2s ease-in-out infinite}
@keyframes tcSleep{0%,100%{transform:scale(1, 1)}50%{transform:scale(1.012, 0.984)}}.animate-tc-sleep{animation:tcSleep 5.6s ease-in-out infinite}
@keyframes tcEat{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.animate-tc-eat{animation:tcEat 0.5s ease-in-out infinite}
@keyframes tcPop{0%,100%{transform:scale(1)}45%{transform:scale(1.13)}70%{transform:scale(0.97)}}.animate-tc-pop{animation:tcPop 0.9s ease-in-out infinite}
@keyframes tcJump{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(calc(var(--uy) * -15)) rotate(1.5deg)}}.animate-tc-jump{animation:tcJump 0.75s ease-in-out infinite}
@keyframes tcLegJump{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.29)}}.animate-tc-legjump{animation:tcLegJump 0.75s ease-in-out infinite}
@keyframes tcBrace{0%,100%{transform:translate(calc(var(--ux) * -1.3), 0)}50%{transform:translate(calc(var(--ux) * 1.3), calc(var(--uy) * 0.6))}}.animate-tc-brace{animation:tcBrace 0.17s linear infinite}
@keyframes tcKnock{0%,100%{transform:skewX(-5deg)}50%{transform:skewX(5deg)}}.animate-tc-knock{animation:tcKnock 0.34s ease-in-out infinite}
@keyframes tcSweat{0%{opacity:0;transform:translate(calc(var(--ux) * var(--fx) * -3), calc(var(--uy) * var(--fy) * -3)) scale(0.5)}18%,62%{opacity:1}100%{opacity:0;transform:translate(calc(var(--ux) * var(--fx) * 18), calc(var(--uy) * var(--fy) * 18)) scale(1)}}.animate-tc-sweat{animation:tcSweat 1.5s ease-out infinite}
@keyframes tcPeekOpen{0%{opacity:0}60%{opacity:1}82%,100%{opacity:0}}.animate-tc-peek-open{animation:tcPeekOpen 3.2s step-end infinite}
@keyframes tcPeekShut{0%{opacity:1}60%{opacity:0}82%,100%{opacity:1}}.animate-tc-peek-shut{animation:tcPeekShut 3.2s step-end infinite}
@keyframes tcConfetti{0%{opacity:0;transform:translateY(-16px) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translateY(var(--tc-fall, 82px)) rotate(360deg)}}.animate-tc-confetti{animation:tcConfetti 1.5s linear infinite}
@keyframes tcRay{to{transform:rotate(360deg)}}.animate-tc-ray{animation:tcRay 7s linear infinite}
@keyframes tcZzz{0%{opacity:0;transform:translateY(calc(var(--uy) * 2)) scale(0.8)}30%{opacity:1}100%{opacity:0;transform:translateY(calc(var(--uy) * -14)) scale(1.1)}}.animate-tc-zzz{animation:tcZzz 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){[class*="animate-tc-"]{animation:none!important}}
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1b1714}
</style><rect x="6" y="6" width="672" height="174" rx="24" fill="#1b1714"/><rect x="2" y="2" width="672" height="174" rx="24" fill="#fbf4e3" stroke="#1b1714" stroke-width="3"/><g transform="translate(54 30) scale(3.8)"><path d="M10 1.7 A8.3 8.3 0 1 1 10 18.3 A8.3 8.3 0 1 1 10 1.7 Z" fill="#c79c63" opacity="1" stroke="#231a14" stroke-width="1.2" stroke-linejoin="round"/><path d="M5.2 8.9 A5.4 5.4 0 0 1 9.4 4.7 C10.4 4.5 10.6 5.7 9.7 6 A4.1 4.1 0 0 0 6.5 9.2 C6.2 10.2 5 9.9 5.2 8.9 Z" fill="#ffffff" opacity="0.55" stroke="none" stroke-width="0" stroke-linejoin="round"/><path d="M16.8 5.24 A8.3 8.3 0 0 1 5.24 16.8 A10.5 10.5 0 0 0 16.8 5.24 Z" fill="#000000" opacity="0.2" stroke="none" stroke-width="0" stroke-linejoin="round"/></g><text x="92" y="136" text-anchor="middle" font-size="16" font-weight="800">Common</text><text x="92" y="156" text-anchor="middle" font-size="13" font-weight="600" opacity="0.65">a round bead</text><g transform="translate(178 30) scale(3.8)"><path d="M10 2.2 L18.4 16.6 L1.6 16.6 Z" fill="#5cc4a9" opacity="1" stroke="#231a14" stroke-width="1.2" stroke-linejoin="round"/><path d="M10 7.38 L13.86 14.01 L6.14 14.01 Z" fill="#ffffff" opacity="0.5" stroke="none" stroke-width="0" stroke-linejoin="round"/><path d="M10 2.2 L18.4 16.6 L13.86 14.01 L10 7.38 Z M18.4 16.6 L1.6 16.6 L6.14 14.01 L13.86 14.01 Z" fill="#000000" opacity="0.2" stroke="none" stroke-width="0" stroke-linejoin="round"/></g><text x="216" y="136" text-anchor="middle" font-size="16" font-weight="800">Uncommon</text><text x="216" y="156" text-anchor="middle" font-size="13" font-weight="600" opacity="0.65">3 corners</text><g transform="translate(302 30) scale(3.8)"><path d="M2.6 2.6 L17.4 2.6 L17.4 17.4 L2.6 17.4 Z" fill="#6e9fe0" opacity="1" stroke="#231a14" stroke-width="1.2" stroke-linejoin="round"/><path d="M6.3 6.3 L13.7 6.3 L13.7 13.7 L6.3 13.7 Z" fill="#ffffff" opacity="0.5" stroke="none" stroke-width="0" stroke-linejoin="round"/><path d="M17.4 2.6 L17.4 17.4 L13.7 13.7 L13.7 6.3 Z M17.4 17.4 L2.6 17.4 L6.3 13.7 L13.7 13.7 Z" fill="#000000" opacity="0.2" stroke="none" stroke-width="0" stroke-linejoin="round"/></g><text x="340" y="136" text-anchor="middle" font-size="16" font-weight="800">Rare</text><text x="340" y="156" text-anchor="middle" font-size="13" font-weight="600" opacity="0.65">4 corners</text><g transform="translate(426 30) scale(3.8)"><path d="M10 1.6 L18.46 7.75 L15.23 17.7 L4.77 17.7 L1.54 7.75 Z" fill="#f0b53a" opacity="1" stroke="#231a14" stroke-width="1.2" stroke-linejoin="round"/><path d="M10 5.87 L14.4 9.07 L12.72 14.24 L7.28 14.24 L5.6 9.07 Z" fill="#ffffff" opacity="0.5" stroke="none" stroke-width="0" stroke-linejoin="round"/><path d="M18.46 7.75 L15.23 17.7 L12.72 14.24 L14.4 9.07 Z M15.23 17.7 L4.77 17.7 L7.28 14.24 L12.72 14.24 Z" fill="#000000" opacity="0.2" stroke="none" stroke-width="0" stroke-linejoin="round"/></g><text x="464" y="136" text-anchor="middle" font-size="16" font-weight="800">Legendary</text><text x="464" y="156" text-anchor="middle" font-size="13" font-weight="600" opacity="0.65">5 corners</text><g transform="translate(550 30) scale(3.8)"><path d="M10 1.2 L17.62 5.6 L17.62 14.4 L10 18.8 L2.38 14.4 L2.38 5.6 Z" fill="#a77ce8" opacity="1" stroke="#231a14" stroke-width="1.2" stroke-linejoin="round"/><path d="M10 5.25 L14.12 7.62 L14.12 12.38 L10 14.75 L5.88 12.38 L5.88 7.62 Z" fill="#ffffff" opacity="0.5" stroke="none" stroke-width="0" stroke-linejoin="round"/><path d="M17.62 5.6 L17.62 14.4 L14.12 12.38 L14.12 7.62 Z M17.62 14.4 L10 18.8 L10 14.75 L14.12 12.38 Z M10 18.8 L2.38 14.4 L5.88 12.38 L10 14.75 Z" fill="#000000" opacity="0.2" stroke="none" stroke-width="0" stroke-linejoin="round"/></g><text x="588" y="136" text-anchor="middle" font-size="16" font-weight="800">Mythic</text><text x="588" y="156" text-anchor="middle" font-size="13" font-weight="600" opacity="0.65">6 corners</text></svg>