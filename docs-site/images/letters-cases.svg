<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 438 247" width="438" height="247" role="img"><title>A lowercase a, and the same letter raised to UPPERCASE</title><style>
@keyframes tcBreathe{0%,100%{transform:translateY(0) scale(1.004, 0.996)}50%{transform:translateY(calc(var(--uy) * -3)) scale(0.995, 1.008)}}.animate-tc-breathe{animation:tcBreathe 3.6s ease-in-out infinite}
@keyframes tcLegBreathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.06)}}.animate-tc-legbreathe{animation:tcLegBreathe 3.6s ease-in-out infinite}
@keyframes tcSigh{0%,100%{transform:translateY(calc(var(--uy) * 1))}45%{transform:translateY(calc(var(--uy) * -1.5))}}.animate-tc-sigh{animation:tcSigh 5.2s ease-in-out infinite}
@keyframes tcLegSigh{0%,100%{transform:scaleY(0.98)}45%{transform:scaleY(1.03)}}.animate-tc-legsigh{animation:tcLegSigh 5.2s ease-in-out infinite}
@keyframes tcSleep{0%,100%{transform:scale(1, 1)}50%{transform:scale(1.012, 0.984)}}.animate-tc-sleep{animation:tcSleep 5.6s ease-in-out infinite}
@keyframes tcEat{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.animate-tc-eat{animation:tcEat 0.5s ease-in-out infinite}
@keyframes tcPop{0%,100%{transform:scale(1)}45%{transform:scale(1.13)}70%{transform:scale(0.97)}}.animate-tc-pop{animation:tcPop 0.9s ease-in-out infinite}
@keyframes tcJump{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(calc(var(--uy) * -15)) rotate(1.5deg)}}.animate-tc-jump{animation:tcJump 0.75s ease-in-out infinite}
@keyframes tcLegJump{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.29)}}.animate-tc-legjump{animation:tcLegJump 0.75s ease-in-out infinite}
@keyframes tcBrace{0%,100%{transform:translate(calc(var(--ux) * -1.3), 0)}50%{transform:translate(calc(var(--ux) * 1.3), calc(var(--uy) * 0.6))}}.animate-tc-brace{animation:tcBrace 0.17s linear infinite}
