# Posts a merged PR's "Tester note" to the beta testers' Telegram group, once production is live
# with it. Vercel reports each production deploy to GitHub as a deployment status; this listens for
# the successful ones, finds the PR behind the deployed commit, and posts its note as @lexigotchi_bot.
#
# A PR opts in with a section in its description:
#
#   ## Tester note
#
#   Spell now lists every word you can spell, rarest first.
#
# No section, no post. A posted PR gets the `beta-posted` label, so a redeploy of the same commit
# never posts twice. Secrets: TELEGRAM_BOT_TOKEN (from @BotFather) and TELEGRAM_CHAT_ID (the group).
# Run it by hand (Actions → Beta updates → Run workflow) to check the bot can reach the group; that
# run never posts.
name: Beta updates

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  post:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          script: |
            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT_ID;
            if (!token || !chatId) {
              core.notice("TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set; nothing posted.");
              return;
            }

            // Telegram Bot API. A basic group that Telegram upgrades to a supergroup gets a new id;
            // the error says which, so the fix is one secret.
            async function telegram(method, body) {
              const res = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(body),
              });
              const data = await res.json();
              if (!data.ok) {
                const moved = data.parameters?.migrate_to_chat_id;
                throw new Error(
                  `${method}: ${data.description}` +
                    (moved ? ` (the group is now a supergroup: set TELEGRAM_CHAT_ID to ${moved})` : ""),
                );
              }
              return data.result;
            }

            if (context.eventName === "workflow_dispatch") {
              const me = await telegram("getMe", {});
              const chat = await telegram("getChat", { chat_id: chatId });
              core.notice(`@${me.username} can reach "${chat.title}". Nothing posted.`);
              return;
            }

            const { owner, repo } = context.repo;
            const sha = context.payload.deployment.sha;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
            const pr = prs.find((p) => p.merged_at && p.base.ref === "main");
            if (!pr) return core.info(`No merged PR behind ${sha.slice(0, 7)}.`);
            if (pr.labels.some((l) => l.name === "beta-posted")) return core.info(`#${pr.number} was already posted.`);

            // The "## Tester note" section: everything under that heading, up to the next heading, a
            // horizontal rule, or the "🤖 Generated with …" line that ends our PR descriptions.
            const lines = (pr.body ?? "").replace(/<!--[\s\S]*?-->/g, "").split(/\r?\n/);
            const start = lines.findIndex((l) => /^#{2,3}\s*tester note\s*$/i.test(l.trim()));
            if (start < 0) return core.info(`#${pr.number} has no tester note.`);
            const rest = lines.slice(start + 1);
            const end = rest.findIndex((l) => /^(#{1,6}\s|-{3,}$|\*{3,}$|🤖)/u.test(l.trim()));
            const note = (end < 0 ? rest : rest.slice(0, end)).join("\n").trim();
            if (!note || /^(none|n\/a|-)$/i.test(note)) return core.info(`#${pr.number}'s tester note is empty.`);

            await telegram("sendMessage", {
              chat_id: chatId,
              text: `${note}\n\nLive now at lexigotchi.fun/play`,
              disable_web_page_preview: true,
            });
            await github.rest.issues.createLabel({ owner, repo, name: "beta-posted", color: "2a9d8f", description: "Posted to the beta testers' Telegram group" }).catch(() => {});
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ["beta-posted"] });
            core.notice(`Posted #${pr.number}'s tester note.`);
